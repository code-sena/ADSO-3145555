name: airline-db

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airline_db}
      POSTGRES_USER: ${POSTGRES_USER:-airline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airline_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airline_user} -d ${POSTGRES_DB:-airline_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint: ["liquibase"]  
   
    command: >
      --changeLogFile=changelog/changelog-master.yaml    
      --url=jdbc:postgresql://postgres:5432/airline_db
      --username=airline_user
      --password=airline_db
      update

volumes:
  postgres_data:
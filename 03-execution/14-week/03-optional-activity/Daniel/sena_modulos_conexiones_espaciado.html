
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,sans-serif)}
.wrap{padding:1.5rem 1rem 2rem}
.hero{text-align:center;margin-bottom:1.2rem}
.hero h2{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.hero p{font-size:13px;color:var(--color-text-secondary)}
.map-area{position:relative;width:100%;overflow:hidden}
.mod-node{
  position:absolute;border-radius:12px;
  border:0.5px solid var(--color-border-secondary);
  background:var(--color-background-primary);
  cursor:pointer;transition:transform 0.15s;overflow:hidden;user-select:none;
}
.mod-node:hover{transform:translateY(-3px)}
.mod-node.active{border-width:2px!important}
.mod-header{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.mod-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mod-title{font-size:12px;font-weight:500;line-height:1.3}
.mod-count{font-size:10px;padding:2px 8px;border-radius:20px;margin:0 12px 9px;display:inline-block}
.conn-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.detail-panel{margin-top:1.2rem;border-radius:12px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);padding:1rem 1.25rem;transition:opacity 0.2s}
.detail-panel.hidden{opacity:0;pointer-events:none}
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.detail-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.detail-title{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.detail-desc{font-size:12px;color:var(--color-text-secondary);margin-top:2px;line-height:1.5}
.section-label{font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;margin-top:10px}
.connections-row{display:flex;flex-wrap:wrap;gap:7px}
.conn-badge{font-size:11px;padding:3px 10px;border-radius:20px;border:0.5px solid;display:flex;align-items:center;gap:5px;cursor:pointer}
.entities-grid{display:flex;flex-wrap:wrap;gap:5px}
.entity-pill{font-size:11px;padding:3px 10px;border-radius:20px}
.hint{text-align:center;font-size:12px;color:var(--color-text-tertiary);margin-top:0.8rem}
</style>

<div class="wrap">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">SENA Schedule Manager — mapa interactivo de módulos y sus conexiones</h2>
  <div class="hero">
    <h2>SENA Schedule Manager — Conexiones entre módulos</h2>
    <p>Haz clic en un módulo para ver sus conexiones y entidades</p>
  </div>
  <div class="map-area" id="mapArea">
    <svg class="conn-svg" id="connSvg"></svg>
  </div>
  <div class="detail-panel hidden" id="detailPanel">
    <div class="detail-header">
      <div class="detail-icon" id="dIcon"></div>
      <div><div class="detail-title" id="dTitle"></div><div class="detail-desc" id="dDesc"></div></div>
    </div>
    <div class="section-label">Se conecta con</div>
    <div class="connections-row" id="dConns"></div>
    <div class="section-label">Entidades</div>
    <div class="entities-grid" id="dEnts"></div>
  </div>
  <p class="hint">Clic en un módulo para explorar · clic de nuevo para deseleccionar</p>
</div>

<script>
const MODS = [
  {id:'academico',    label:'Académico',     icon:'ti-school',          color:{bg:'#E6F1FB',border:'#85B7EB',text:'#0C447C',icon:'#378ADD',bb:'#E6F1FB',bt:'#185FA5'}, desc:'Núcleo de datos maestros: define qué se enseña, dónde y a quién.', entities:['Centro de Formación','Sede','Línea Tecnológica','Programa','Competencia','RAP','Ficha','Aprendiz'], connects:['instructores','ambientes','horarios','evaluacion','aprendices','programacion','calendario']},
  {id:'instructores', label:'Instructores',  icon:'ti-user-check',      color:{bg:'#E1F5EE',border:'#5DCAA5',text:'#085041',icon:'#1D9E75',bb:'#E1F5EE',bt:'#0F6E56'}, desc:'Disponibilidad, contratos y especialidades de cada instructor.', entities:['Instructor','Contrato','Especialidad','Disponibilidad','Asignaciones','Incapacidad'], connects:['horarios','programacion','novedades']},
  {id:'ambientes',    label:'Ambientes',     icon:'ti-building',        color:{bg:'#FAEEDA',border:'#EF9F27',text:'#633806',icon:'#BA7517',bb:'#FAEEDA',bt:'#854F0B'}, desc:'Aulas, equipamiento, mantenimientos y reservas.', entities:['Ambiente','Bloque','Equipamiento','Mantenimiento','Reservas'], connects:['horarios','programacion','novedades','calendario']},
  {id:'horarios',     label:'Horarios',      icon:'ti-calendar-time',   color:{bg:'#EEEDFE',border:'#AFA9EC',text:'#26215C',icon:'#7F77DD',bb:'#EEEDFE',bt:'#534AB7'}, desc:'Motor central: cruza instructor + ambiente + ficha y detecta conflictos.', entities:['Horario','Bloque Horario','Franja Horaria','Conflictos','Observaciones'], connects:['academico','instructores','ambientes','aprendices','novedades','reportes']},
  {id:'evaluacion',   label:'Evaluación',    icon:'ti-clipboard-check', color:{bg:'#FAECE7',border:'#F0997B',text:'#4A1B0C',icon:'#D85A30',bb:'#FAECE7',bt:'#993C1D'}, desc:'Registra el resultado académico de cada aprendiz por RAP y competencia.', entities:['Competencia','RAP','Evaluaciones','Evidencias','Calificaciones'], connects:['academico','aprendices','reportes']},
  {id:'aprendices',   label:'Aprendices',    icon:'ti-users',           color:{bg:'#FBEAF0',border:'#ED93B1',text:'#4B1528',icon:'#D4537E',bb:'#FBEAF0',bt:'#993556'}, desc:'Matrícula, asistencia y seguimiento académico del estudiante.', entities:['Aprendiz','Matrícula','Asistencia','Seguimiento'], connects:['academico','horarios','evaluacion','reportes']},
  {id:'programacion', label:'Programación',  icon:'ti-layout-grid',     color:{bg:'#EAF3DE',border:'#97C459',text:'#173404',icon:'#639922',bb:'#EAF3DE',bt:'#3B6D11'}, desc:'Planea qué RAP dictar, con qué instructor y en qué ambiente.', entities:['Planeación','Carga Horaria','Asignaciones','Programación'], connects:['academico','instructores','ambientes','horarios','calendario']},
  {id:'novedades',    label:'Novedades',     icon:'ti-alert-triangle',  color:{bg:'#FCEBEB',border:'#F09595',text:'#501313',icon:'#E24B4A',bb:'#FCEBEB',bt:'#A32D2D'}, desc:'Bloquea o reprograma ante incapacidades y mantenimientos.', entities:['Novedades','Excepciones','Incapacidades','Reprogramaciones'], connects:['horarios','instructores','ambientes','calendario']},
  {id:'calendario',   label:'Calendario',    icon:'ti-calendar-event',  color:{bg:'#E1F5EE',border:'#5DCAA5',text:'#04342C',icon:'#1D9E75',bb:'#E1F5EE',bt:'#085041'}, desc:'Define días hábiles, festivos y periodos. Sin día válido no hay clase.', entities:['Calendario','Periodos','Semanas','Festivos','Eventos'], connects:['horarios','programacion','novedades','reportes']},
  {id:'admin',        label:'Administrativo',icon:'ti-settings',        color:{bg:'#F1EFE8',border:'#B4B2A9',text:'#2C2C2A',icon:'#888780',bb:'#F1EFE8',bt:'#5F5E5A'}, desc:'Controla quién puede ver, crear o modificar datos del sistema.', entities:['Usuarios','Roles','Permisos','Configuraciones'], connects:['horarios','academico','reportes']},
  {id:'reportes',     label:'Reportes',      icon:'ti-chart-bar',       color:{bg:'#EEEDFE',border:'#AFA9EC',text:'#26215C',icon:'#534AB7',bb:'#EEEDFE',bt:'#534AB7'}, desc:'Consolida datos de todos los módulos para indicadores y estadísticas.', entities:['Reportes','Indicadores','Estadísticas'], connects:['horarios','evaluacion','aprendices','calendario']},
];

const NODE_W = 138, NODE_H = 66;
const MAP_H = 720;

const LAYOUT = [
  {id:'academico',    px:0.18, py:0.07},
  {id:'admin',        px:0.50, py:0.07},
  {id:'instructores', px:0.82, py:0.07},
  {id:'ambientes',    px:0.08, py:0.38},
  {id:'horarios',     px:0.50, py:0.38},
  {id:'evaluacion',   px:0.82, py:0.38},
  {id:'calendario',   px:0.08, py:0.68},
  {id:'programacion', px:0.29, py:0.68},
  {id:'novedades',    px:0.68, py:0.68},
  {id:'aprendices',   px:0.88, py:0.55},
  {id:'reportes',     px:0.50, py:0.92},
];

let activeId = null;
let centers = {};
const mapArea = document.getElementById('mapArea');
const svg = document.getElementById('connSvg');
const detail = document.getElementById('detailPanel');
mapArea.style.height = MAP_H + 'px';

function getW(){ return mapArea.getBoundingClientRect().width || 640; }

function buildAll(){
  mapArea.querySelectorAll('.mod-node').forEach(n=>n.remove());
  const W = getW();
  centers = {};
  svg.setAttribute('viewBox',`0 0 ${W} ${MAP_H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', MAP_H);

  LAYOUT.forEach(pos=>{
    const mod = MODS.find(m=>m.id===pos.id);
    const x = pos.px * W - NODE_W/2;
    const y = pos.py * MAP_H - NODE_H/2;
    centers[mod.id] = {x: pos.px*W, y: pos.py*MAP_H};

    const el = document.createElement('div');
    el.className = 'mod-node';
    el.id = 'node-'+mod.id;
    el.style.cssText = `left:${Math.max(4,x)}px;top:${y}px;width:${NODE_W}px;border-color:${mod.color.border};`;
    el.innerHTML = `
      <div class="mod-header" style="background:${mod.color.bg}">
        <div class="mod-icon" style="background:${mod.color.bg};border:0.5px solid ${mod.color.border}">
          <i class="ti ${mod.icon}" style="color:${mod.color.icon};font-size:16px" aria-hidden="true"></i>
        </div>
        <span class="mod-title" style="color:${mod.color.text}">${mod.label}</span>
      </div>
      <span class="mod-count" style="background:${mod.color.bb};color:${mod.color.bt};border:0.5px solid ${mod.color.border}">${mod.entities.length} entidades</span>
    `;
    el.addEventListener('click',()=>selectMod(mod.id));
    mapArea.appendChild(el);
  });

  if(activeId) drawLines(activeId);
}

function drawLines(id){
  svg.innerHTML='';
  if(!id) return;
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=`<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke="context-stroke"/></marker>`;
  svg.appendChild(defs);

  const mod = MODS.find(m=>m.id===id);
  const from = centers[id];

  mod.connects.forEach(tid=>{
    const to = centers[tid];
    if(!to) return;
    const dx=to.x-from.x, dy=to.y-from.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/dist, ny=dy/dist;
    const pad=22;
    const toMod=MODS.find(m=>m.id===tid);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', from.x+nx*pad);
    line.setAttribute('y1', from.y+ny*pad);
    line.setAttribute('x2', to.x-nx*pad);
    line.setAttribute('y2', to.y-ny*pad);
    line.setAttribute('stroke', toMod.color.icon);
    line.setAttribute('stroke-width','1.5');
    line.setAttribute('stroke-dasharray','5 3');
    line.setAttribute('marker-end','url(#arr)');
    line.setAttribute('opacity','0.75');
    svg.appendChild(line);
  });
}

function clearActive(){
  document.querySelectorAll('.mod-node').forEach(n=>{
    n.classList.remove('active');
    n.style.borderWidth='0.5px';
    const mod=MODS.find(m=>m.id===n.id.replace('node-',''));
    if(mod) n.style.borderColor=mod.color.border;
  });
}

function selectMod(id){
  if(activeId===id){ activeId=null; drawLines(null); clearActive(); detail.classList.add('hidden'); return; }
  activeId=id;
  drawLines(id);
  clearActive();
  const mod=MODS.find(m=>m.id===id);
  const node=document.getElementById('node-'+id);
  if(node){ node.classList.add('active'); node.style.borderColor=mod.color.icon; node.style.borderWidth='2px'; }
  mod.connects.forEach(tid=>{
    const n=document.getElementById('node-'+tid);
    const tm=MODS.find(m=>m.id===tid);
    if(n){ n.style.borderColor=tm.color.icon; n.style.borderWidth='1.5px'; }
  });
  showDetail(id);
}

function showDetail(id){
  const mod=MODS.find(m=>m.id===id);
  document.getElementById('dIcon').style.cssText=`background:${mod.color.bg};border:0.5px solid ${mod.color.border}`;
  document.getElementById('dIcon').innerHTML=`<i class="ti ${mod.icon}" style="color:${mod.color.icon};font-size:18px" aria-hidden="true"></i>`;
  document.getElementById('dTitle').textContent=mod.label;
  document.getElementById('dDesc').textContent=mod.desc;

  const connsEl=document.getElementById('dConns');
  connsEl.innerHTML='';
  mod.connects.forEach(tid=>{
    const tm=MODS.find(m=>m.id===tid);
    const b=document.createElement('span');
    b.className='conn-badge';
    b.style.cssText=`background:${tm.color.bg};color:${tm.color.text};border-color:${tm.color.border}`;
    b.innerHTML=`<i class="ti ${tm.icon}" style="font-size:12px" aria-hidden="true"></i>${tm.label}`;
    b.addEventListener('click',e=>{e.stopPropagation();selectMod(tid);});
    connsEl.appendChild(b);
  });

  const entsEl=document.getElementById('dEnts');
  entsEl.innerHTML='';
  mod.entities.forEach(e=>{
    const p=document.createElement('span');
    p.className='entity-pill';
    p.style.cssText=`background:${mod.color.bg};color:${mod.color.text};border:0.5px solid ${mod.color.border}`;
    p.textContent=e;
    entsEl.appendChild(p);
  });
  detail.classList.remove('hidden');
}

buildAll();
window.addEventListener('resize',()=>{ buildAll(); });
</script>
